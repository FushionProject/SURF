name: ROPE release regressions

on:
  pull_request:
  push:
    branches: [main, 'codex/rope-release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SURF_BILLING_ENABLED: 'false'
      SURF_BILLING_LIVE_ENABLED: 'false'
      SURF_SPOT_STATS_RELEASE_READY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:release
      - run: npm run build -- --webpack
      - run: npm run test:production-access
